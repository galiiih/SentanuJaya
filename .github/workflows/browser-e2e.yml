name: Browser E2E

on:
  push:
    branches: [feat/template-management-grapesjs, feat/sidebar-collapse-navigation-new, feat/sidebar-login-intro-isolated]
  pull_request:
    # Run checks for PRs targeting either maintained integration branch.
    # `branches` filters the PR base branch, not the source/head branch.
    branches: [main, master, feat/template-management-grapesjs]
  workflow_dispatch:

# Only the newest push for a branch needs a full browser run; older long suites are superseded.
concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentanu_jaya_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentanu_jaya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sentanu_jaya_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Prepare Laravel environment
        working-directory: backend
        run: |
          cp .env.example .env
          sed -i 's/^APP_NAME=.*/APP_NAME="Sentanu Jaya Web App"/' .env
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=sentanu_jaya_test|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=postgres|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=postgres|' .env
          sed -i 's|^SESSION_DRIVER=.*|SESSION_DRIVER=file|' .env
          php artisan key:generate --force
          php artisan migrate:fresh --seed --force
      - name: Run invoice and payment backend integration tests
        working-directory: backend
        run: php artisan test tests/Feature/Api/V1/InvoicePaymentApiTest.php
      # Feature tests using RefreshDatabase can reset the database and remove seeded E2E users.
      # Reseed after backend tests so browser tests always start with a known login account.
      - name: Restore browser E2E seed data
        working-directory: backend
        run: php artisan db:seed --force
      - name: Seed dedicated browser E2E accounts when available
        working-directory: backend
        run: |
          if [ -f database/seeders/BrowserE2ESeeder.php ]; then
            php artisan db:seed --class=BrowserE2ESeeder --force
          else
            echo "BrowserE2ESeeder is not part of this branch; retaining default seed data."
          fi
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend TypeScript and production build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Run the new intro scenarios independently so an unrelated pre-existing CRUD failure
      # cannot stop Playwright's maxFailures guard before these tests are reached.
      - name: Run login intro browser tests when available
        working-directory: frontend
        run: |
          if [ -f e2e/login-intro.spec.ts ]; then
            npx playwright test e2e/login-intro.spec.ts --reporter=list
          else
            echo "Dedicated login intro spec is not part of this branch; the full E2E suite will run below."
          fi
      - name: Run browser E2E
        working-directory: frontend
        # Playwright has its own 25-minute global timeout; this shell watchdog is a
        # second line of defense if the Node/Playwright process stops responding.
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 26m npm run test:e2e -- --reporter=list,html
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error::Browser E2E exceeded the 26-minute shell watchdog."
            ps -eo pid,ppid,stat,etime,cmd --sort=-etime | head -n 25
          fi
          exit "$status"
      - name: Upload Playwright report and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: |
            frontend/test-results/**/test-failed-1.png
            frontend/test-results/**/error-context.md
            frontend/playwright-report/index.html
          if-no-files-found: ignore
          retention-days: 5
